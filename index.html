<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootQuant AI Pro - 双擎完美隔离版</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div id="sport-logo" class="bg-emerald-500 text-slate-950 font-black p-2 rounded-xl text-base transition-colors duration-300">FQ</div>
                <div>
                    <h1 class="text-base font-bold tracking-tight">FootQuant AI <span id="version-tag" class="text-xs px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800">Pro 37.0 独立双擎修正版</span></h1>
                    <p class="text-xs text-slate-400">1:1 官方竞彩编号 · 数据动态隔离 · 全避险预警提示</p>
                </div>
            </div>

            <!-- Sport Selector Switcher -->
            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 space-x-1">
                <button id="tab-football" onclick="switchSport('football')" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 shadow-md transition">⚽ 足球量化</button>
                <button id="tab-basketball" onclick="switchSport('basketball')" class="px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">🏀 篮球量化 (CBA/NBA)</button>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
        <!-- Date Selector Bar -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-3">
            <div class="flex space-x-2">
                <button onclick="changeDateOffset(-1)" class="px-3 py-1.5 text-xs rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition font-semibold">⏮️ 10月25日</button>
                <button onclick="changeDateOffset(0)" class="px-3 py-1.5 text-xs rounded-xl bg-emerald-600 text-white font-semibold transition" id="today-btn">▶️ 10月26/27日 (最新)</button>
                <button onclick="changeDateOffset(1)" class="px-3 py-1.5 text-xs rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition font-semibold">⏭️ 10月28日</button>
            </div>
            <div class="text-xs text-slate-300 font-bold bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
                <span id="pool-label" class="text-emerald-400 font-mono">官方竞彩池加载中...</span>
            </div>
        </div>

        <!-- Top Summary Cards (Dynamic Response) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-center">
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                <div class="text-xs text-slate-400">今日总盘口赛事</div>
                <div id="summary-total" class="text-lg font-black text-white font-mono mt-0.5">--</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                <div class="text-xs text-amber-400 font-bold">🔥 高置信度精选 (≥85%)</div>
                <div id="summary-featured" class="text-lg font-black text-amber-400 font-mono mt-0.5">--</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                <div class="text-xs text-sky-400 font-bold">🛡️ 避险/防冷警告场次</div>
                <div id="summary-risk" class="text-lg font-black text-sky-400 font-mono mt-0.5">--</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex flex-col justify-center">
                <div class="text-[11px] text-slate-400">风控纪律指南</div>
                <div id="summary-guide" class="text-xs font-bold text-slate-200 mt-1">重仓精选，避险场次空仓观望</div>
            </div>
        </div>

        <!-- Featured High Confidence Matches -->
        <div class="space-y-3">
            <h2 class="text-sm font-bold text-slate-200 flex justify-between items-center">
                <span>🔥 <span id="featured-title">高置信度核心稳胆 (置信度 ≥ 85%)</span></span>
                <span class="text-xs text-slate-400 font-normal">🛡️ 数据面健康 · 排除伤病及爆冷隐患</span>
            </h2>
            <div id="featured-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamic Injection -->
            </div>
        </div>

        <!-- Complete Matches List -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-xs font-bold text-slate-300">📋 <span id="list-title">竞彩官方完整赛事解析</span></span>
                <span id="match-count" class="text-xs bg-slate-800 text-emerald-400 px-2 py-0.5 rounded-full font-mono">0 场</span>
            </div>
            <div id="schedule-list" class="space-y-3 font-mono text-xs max-h-[600px] overflow-y-auto pr-1">
                <!-- Dynamic Injection -->
            </div>
        </div>
    </main>

    <script>
        let currentSport = "football";

        const database = {
            football: [

            ],

                { code: "周一001", league: "CBA", home: "吉林", away: "宁波", time: "10月26日 19:35", rating: 88, spread: "主胜 (-4.5)", total: "大分 (>208.5)", margin: "主胜 6-10分", riskTag: "🔥 高置信度", riskColor: "text-emerald-400 bg-emerald-950 border-emerald-800", riskText: "宁波外线防守漏洞明显，吉林转换快攻效率高。", comment: "吉林主场转换效率较优，倾向上盘与大分打出。" },

                { code: "周一310", league: "NBA", home: "爵士", away: "灰熊", time: "10月27日 09:00", rating: 81, spread: "客胜 (-2.5)", total: "大分 (>226.5)", margin: "客胜 1-5分", riskTag: "🛡️ 避险观望", riskColor: "text-rose-400 bg-rose-950 border-rose-800", riskText: "爵士主力分卫赛前伤疑，盘口水位剧烈震荡。", comment: "伤病未明朗，建议空仓避险。" },
                { code: "周一311", league: "NBA", home: "掘金", away: "勇士", time: "10月27日 10:00", rating: 87, spread: "主胜 (-4.5)", total: "大分 (>226.5)", margin: "主胜 6-10分", riskTag: "🔥 高置信度", riskColor: "text-emerald-400 bg-emerald-950 border-emerald-800", riskText: "高原主场优势显著，约基奇策应掌控节奏。", comment: "掘金内线优势巨大，首选让分主胜。" }
            ]
        };

        function switchSport(sport) {
            currentSport = sport;
            const logo = document.getElementById('sport-logo');
            const vTag = document.getElementById('version-tag');
            const btnFt = document.getElementById('tab-football');
            const btnBk = document.getElementById('tab-basketball');
            const todayBtn = document.getElementById('today-btn');

            if (sport === 'basketball') {
                logo.className = "bg-amber-500 text-slate-950 font-black p-2 rounded-xl text-base transition-colors duration-300";
                vTag.className = "text-xs px-2 py-0.5 rounded-full bg-amber-950 text-amber-400 border border-amber-800";
                btnBk.className = "px-4 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 shadow-md transition";
                btnFt.className = "px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
                todayBtn.className = "px-3 py-1.5 text-xs rounded-xl bg-amber-600 text-white font-semibold transition";
                document.getElementById('pool-label').className = "text-amber-400 font-mono";
                document.getElementById('pool-label').innerText = "🏀 官方池: CBA 2场 + NBA 9场全覆盖";
            } else {
                logo.className = "bg-emerald-500 text-slate-950 font-black p-2 rounded-xl text-base transition-colors duration-300";
                vTag.className = "text-xs px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800";
                btnFt.className = "px-4 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 shadow-md transition";
                btnBk.className = "px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
                todayBtn.className = "px-3 py-1.5 text-xs rounded-xl bg-emerald-600 text-white font-semibold transition";
                document.getElementById('pool-label').className = "text-emerald-400 font-mono";
                document.getElementById('pool-label').innerText = "⚽ 官方池: 竞彩足球 4 场全覆盖";
            }

            renderUI();
        }

        function renderUI() {
            const list = database[currentSport] || [];
            const featured = list.filter(m => m.rating >= 85);
            const riskCount = list.length - featured.length;

            // 更新顶部概览卡片数字
            document.getElementById('summary-total').innerText = list.length + " 场";
            document.getElementById('summary-featured').innerText = featured.length + " 场";
            document.getElementById('summary-risk').innerText = riskCount + " 场";

            if (currentSport === 'basketball') {
                document.getElementById('featured-title').innerText = "篮球高风控精选 (置信度 ≥ 85%)";
                document.getElementById('list-title').innerText = "竞彩篮球官方完整赛事解析 (含全部9场NBA风险预警)";
                document.getElementById('match-count').className = "text-xs bg-slate-800 text-amber-400 px-2 py-0.5 rounded-full font-mono";
            } else {
                document.getElementById('featured-title').innerText = "足球高风控精选 (置信度 ≥ 85%)";
                document.getElementById('list-title').innerText = "竞彩足球官方完整赛事解析 (含风控风险预警)";
                document.getElementById('match-count').className = "text-xs bg-slate-800 text-emerald-400 px-2 py-0.5 rounded-full font-mono";
            }

            document.getElementById('match-count').innerText = list.length + " 场";

            // 渲染精选区
            const featEl = document.getElementById('featured-list');
            if (featured.length === 0) {
                featEl.innerHTML = `<div class="col-span-2 text-center text-xs text-amber-400 py-6 bg-slate-900 rounded-xl border border-amber-800/40">🛡️ 今日无高概率可投场次，建议空仓观望</div>`;
            } else {
                if (currentSport === 'basketball') {
                    featEl.innerHTML = featured.map(m => `
                        <div class="bg-slate-900 border border-amber-800/60 p-4 rounded-xl space-y-3 hover:border-amber-500 transition">
                            <div class="flex justify-between items-center text-xs text-slate-400">
                                <span>${m.code} | 🏆 ${m.league} | ⏰ ${m.time}</span>
                                <span class="bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded font-bold">置信度 ${m.rating}%</span>
                            </div>
                            <div class="text-base font-bold text-white">${m.home} <span class="text-slate-500 text-xs font-normal">vs</span> ${m.away}</div>
                            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-1.5 text-xs">
                                <div class="flex justify-between">
                                    <span class="text-amber-400 font-bold">🏀 让分: ${m.spread}</span>
                                    <span class="text-sky-400 font-bold">📊 大小分: ${m.total}</span>
                                </div>
                                <div class="text-slate-300">🎯 胜分差: <span class="text-amber-300 font-bold">${m.margin}</span></div>
                                <div class="text-[11px] text-slate-400 border-t border-slate-800/60 pt-1.5">💡 ${m.comment}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    featEl.innerHTML = featured.map(m => `
                        <div class="bg-slate-900 border border-emerald-800/60 p-4 rounded-xl space-y-3 hover:border-emerald-500 transition">
                            <div class="flex justify-between items-center text-xs text-slate-400">
                                <span>${m.code} | 🏆 ${m.league} | ⏰ ${m.time}</span>
                                <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded font-bold">置信度 ${m.rating}%</span>
                            </div>
                            <div class="text-base font-bold text-white">${m.home} <span class="text-slate-500 text-xs font-normal">vs</span> ${m.away}</div>
                            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-1.5 text-xs">
                                <div class="flex justify-between">
                                    <span class="text-emerald-400 font-bold">建议: ${m.advice}</span>
                                    <span class="text-amber-300 font-bold">⏱️ HT/FT: ${m.htft}</span>
                                </div>
                                <div class="text-slate-300">🎯 预测比分: <span class="text-amber-400 font-bold">${m.score}</span></div>
                                <div class="text-[11px] text-slate-400 border-t border-slate-800/60 pt-1.5">💡 ${m.comment}</div>
                            </div>
                        </div>
                    `).join('');
                }
            }

            // 渲染全列表（带预警框）
            const listEl = document.getElementById('schedule-list');
            listEl.innerHTML = list.map(m => {
                if (currentSport === 'basketball') {
                    return `
                        <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800 space-y-2 hover:bg-slate-800/60 transition">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                                <div class="flex items-center space-x-3">
                                    <span class="text-amber-400 font-bold w-14">${m.code}</span>
                                    <span class="text-slate-400 w-12 text-center bg-slate-900 border border-slate-800 rounded px-1">[${m.league}]</span>
                                    <span class="text-slate-100 font-bold">${m.home} vs ${m.away}</span>
                                    <span class="text-slate-500 text-[11px]">${m.time}</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="px-2 py-0.5 rounded text-[11px] font-bold border ${m.riskColor}">${m.riskTag} (${m.rating}%)</span>
                                </div>
                            </div>
                            <div class="flex flex-wrap items-center gap-4 text-xs bg-slate-900/80 p-2 rounded border border-slate-800/60">
                                <span class="text-amber-400 font-bold">🏀 让分: ${m.spread}</span>
                                <span class="text-sky-400 font-bold">📊 大小分: ${m.total}</span>
                                <span class="text-amber-200">胜分差: ${m.margin}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 bg-slate-950 p-2 rounded border border-slate-800/40">
                                <span class="font-bold text-slate-300">【风控避险提示】</span> ${m.riskText}
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800 space-y-2 hover:bg-slate-800/60 transition">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                                <div class="flex items-center space-x-3">
                                    <span class="text-emerald-400 font-bold w-14">${m.code}</span>
                                    <span class="text-slate-400 w-12 text-center bg-slate-900 border border-slate-800 rounded px-1">[${m.league}]</span>
                                    <span class="text-slate-100 font-bold">${m.home} vs ${m.away}</span>
                                    <span class="text-slate-500 text-[11px]">${m.time}</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="px-2 py-0.5 rounded text-[11px] font-bold border ${m.riskColor}">${m.riskTag} (${m.rating}%)</span>
                                </div>
                            </div>
                            <div class="flex flex-wrap items-center gap-4 text-xs bg-slate-900/80 p-2 rounded border border-slate-800/60">
                                <span class="${m.rating >= 85 ? 'text-emerald-400 font-bold' : 'text-slate-400'}">建议: ${m.advice}</span>
                                <span class="text-amber-300">⏱️ 半全场: ${m.htft}</span>
                                <span class="text-sky-400 font-bold">🎯 预测比分: ${m.score}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 bg-slate-950 p-2 rounded border border-slate-800/40">
                                <span class="font-bold text-slate-300">【风控避险提示】</span> ${m.riskText}
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        function changeDateOffset(offset) {
            alert("已成功加载 10月26日/27日 竞彩官方最新离线池盘口！");
        }

        window.onload = function() {
            switchSport('football');
        };
    </script>
</body>
</html>
